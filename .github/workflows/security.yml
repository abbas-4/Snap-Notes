# Ongoing security checks: vulnerable dependencies, dependencies a pull request adds, and secrets
# committed to the repository. Runs on every pull request, on main, and weekly, so a newly
# published advisory against an unchanged dependency is still noticed.
#
# Maintenance: see "Security checks" in docs/SECURITY_PRODUCTION_CHECKLIST.md.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:23 UTC.
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency vulnerabilities (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # What ships to browsers: any known vulnerability blocks.
      - name: Production dependencies
        run: npm audit --omit=dev --audit-level=low

      # Build and test tools, and the Edge Function's dependencies (@anthropic-ai/sdk and zod
      # are dev dependencies here, mirrored in supabase/functions/generate-flashcards/deno.json):
      # high and critical advisories block; lower ones are listed in the log.
      - name: All dependencies
        run: npm audit --audit-level=high

      # The lockfile's packages match the signatures and provenance their registry published.
      - name: Registry signatures
        run: |
          npm ci --ignore-scripts
          npm audit signatures

  dependency-review:
    name: Dependencies added by this pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Licences that would conflict with publishing this MIT-licensed app.
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  secrets:
    name: Committed secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so a secret added and later removed is still found.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings go to the job log and summary; the token is read-only, so no PR comments.
          GITLEAKS_ENABLE_COMMENTS: false
