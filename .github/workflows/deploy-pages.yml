# Builds, verifies and publishes https://abbas-4.github.io/Snap-Notes/.
#
# PUBLISH (under `env` below) decides what the site root serves:
#   legacy  the original single-file app (legacy/index.html), byte-for-byte, at the site
#           root. This is the state before the cutover (Milestone 5).
#   app     the Vite production build at the site root, with the original app kept at
#           /legacy/index.html.
#
# Cutover: change PUBLISH to app. Rollback: change it back to legacy. Every run tests, builds
# and verifies the React app whichever value is set, so both are always known to be
# deployable, and the smoke job checks what the live site really serves after each
# deployment. A rollback run therefore also needs the tests and build to pass; if they
# cannot, re-run the deploy job of the last run that published the original app.
#
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # On pull requests the site is built and verified, but never deployed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Milestone 5 cutover: the React app is live. Set back to `legacy` to roll back.
  PUBLISH: app

jobs:
  build:
    name: Build and verify site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # Type-checks and writes the production build to dist/.
      #
      # Accounts and sync are switched on by two repository *variables* (Settings → Secrets and
      # variables → Actions → Variables), not secrets: both are public by design and end up in the
      # JavaScript every visitor downloads. Without them the build is the local-only app. Never
      # put a secret or service_role key here; the app refuses to use one.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}

      # Proven in both modes, so the cutover never deploys a build that nobody has checked.
      - name: Verify the React build is deployable
        run: node scripts/verify-site.mjs dist --expect app --no-legacy

      # Content Security Policy present; no secret key, source map or development file in it.
      - name: Check the build for security regressions
        run: node scripts/verify-build-security.mjs dist

      - name: Assemble site according to PUBLISH
        run: |
          case "$PUBLISH" in
            legacy)
              mkdir _site
              cp legacy/index.html _site/index.html
              ;;
            app)
              mkdir -p _site/legacy
              cp -R dist/. _site/
              cp legacy/index.html _site/legacy/index.html
              ;;
            *)
              echo "::error::PUBLISH must be 'legacy' or 'app', not '$PUBLISH'"
              exit 1
              ;;
          esac

      - name: Verify the assembled site
        run: |
          node scripts/verify-site.mjs _site --expect "$PUBLISH"
          if [ "$PUBLISH" = app ]; then
            node scripts/verify-legacy.mjs legacy/index.html _site/legacy/index.html
          else
            node scripts/verify-legacy.mjs legacy/index.html _site/index.html
          fi
          if [ "$PUBLISH" = app ]; then node scripts/verify-build-security.mjs _site; fi
          echo "Site contents:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    # Only main is deployed; pull requests stop after the build job.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Smoke-test the live site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Fails the run when the deployed site serves something other than PUBLISH says, which
      # is how a wrong index.html at the root would otherwise go unnoticed for weeks.
      - name: Check what the live site serves
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-site.mjs --url "$PAGE_URL" --expect "$PUBLISH" --retries 10 --delay 15
