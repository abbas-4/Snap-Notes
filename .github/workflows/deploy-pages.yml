# Builds, verifies and publishes https://abbas-4.github.io/Snap-Notes/.
#
# PUBLISH (under `env` below) decides what the site root serves:
#   legacy  the original single-file app (legacy/index.html), byte-for-byte, at the site
#           root. This is the state before the cutover (Milestone 5).
#   app     the Vite production build at the site root, with the original app kept at
#           /legacy/index.html.
#
# Cutover: change PUBLISH to app. Rollback: change it back to legacy. Nothing else has to
# change, because every run builds and verifies the React app whichever value is set, so
# both are always known to be deployable, and the smoke job checks what the live site
# really serves after each deployment.
#
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # On pull requests the site is built and verified, but never deployed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLISH: legacy

jobs:
  build:
    name: Build and verify site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      # Type-checks and writes the production build to dist/.
      - run: npm run build

      # Proven in both modes, so the cutover never deploys a build that nobody has checked.
      - name: Verify the React build is deployable
        run: node scripts/verify-site.mjs dist --expect app --no-legacy

      - name: Assemble site according to PUBLISH
        run: |
          case "$PUBLISH" in
            legacy)
              mkdir _site
              cp legacy/index.html _site/index.html
              ;;
            app)
              mkdir -p _site/legacy
              cp -R dist/. _site/
              cp legacy/index.html _site/legacy/index.html
              ;;
            *)
              echo "::error::PUBLISH must be 'legacy' or 'app', not '$PUBLISH'"
              exit 1
              ;;
          esac

      - name: Verify the assembled site
        run: |
          node scripts/verify-site.mjs _site --expect "$PUBLISH"
          if [ "$PUBLISH" = app ]; then
            node scripts/verify-legacy.mjs legacy/index.html _site/legacy/index.html
          else
            node scripts/verify-legacy.mjs legacy/index.html _site/index.html
          fi
          echo "Site contents:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    # Only main is deployed; pull requests stop after the build job.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: Smoke-test the live site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Fails the run when the deployed site serves something other than PUBLISH says, which
      # is how a wrong index.html at the root would otherwise go unnoticed for weeks.
      - name: Check what the live site serves
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/verify-site.mjs --url "$PAGE_URL" --expect "$PUBLISH" --retries 10 --delay 15
