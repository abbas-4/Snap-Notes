# Static analysis of the app, the Edge Function code and the repository's scripts and workflows
# with GitHub CodeQL. Results appear under Security → Code scanning. To make a new alert block
# merging, require the "CodeQL" check in the branch ruleset (docs/SECURITY_PRODUCTION_CHECKLIST.md).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Thursdays, 05:41 UTC.
    - cron: '41 5 * * 4'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
