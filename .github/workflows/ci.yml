name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # The Edge Function's entry point, type-checked by Deno itself.
      - run: npm run check:functions
      - run: npm test
      - run: npm run build

      - name: Check the legacy app is unchanged
        run: npm run verify:legacy

  integration:
    name: Integration tests against a local Supabase stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Postgres with the migrations in supabase/migrations applied, the auth server, the API
      # gateway and the Mailpit inbox that catches its emails. Docker is preinstalled on the runner.
      - name: Start Supabase
        run: npm run db:start

      # Accounts, password recovery, sync between two devices, conflicts, Row Level Security, and
      # the AI generation allowance and Edge Function, all against the real services. Uses the
      # stack's fixed local development keys only; no AI provider key is configured.
      - run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: npx --yes supabase@2.122.0 stop --no-backup
